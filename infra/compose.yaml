name: shoulder-local
services:
  minio:
    # MinIO's own registry, not Docker Hub: anonymous Docker Hub pulls of these
    # images now fail from shared CI egress ("pull access denied"). The release
    # and the manifest digest are unchanged -- quay.io serves the identical
    # manifest list, so this is a source change, not a version change.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/bootstrap-infra.ps1}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/bootstrap-infra.ps1}
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  mc:
    # Same registry change, same release, same digest as the server above.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: [tools]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/bootstrap-infra.ps1}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/bootstrap-infra.ps1}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing local/shoulder-local >/dev/null
        mc anonymous set none local/shoulder-local >/dev/null
volumes:
  minio-data:
