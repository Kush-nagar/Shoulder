[project]
name = "shoulder-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic==1.19.2",
    "boto3==1.43.91",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pyjwt[crypto]==2.13.0",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "ruff==0.16.6",
    "pip-audit==2.10.1",
    "boto3-stubs[s3]==1.43.91",
]

[tool.uv]
package = false
required-version = "==0.12.10"
cache-dir = ".cache/uv"

[tool.ruff]
target-version = "py311"
include = ["services/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
# Use mypy's supported file cache; SQLite DLLs may be blocked on managed Windows.
sqlite_cache = false
explicit_package_bases = true
# Test suites share fixtures by module name, matching unittest discovery.
mypy_path = "tests"
files = ["services/api", "services/worker", "services/agentops", "scripts", "tests"]
exclude = ["node_modules", ".venv", ".tools"]
