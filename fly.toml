# Shoulder API (demo). Secrets are set with `fly secrets set`, never here.
app = "shoulder-api-demo"
primary_region = "ord"

[build]
  dockerfile = "infra/api.Dockerfile"

[env]
  R2_REGION = "auto"
  AI_COACH_MODEL = "deepseek/deepseek-chat"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
