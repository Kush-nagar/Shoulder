name: AgentOps Worker

# One worker, one task, one branch. The coordinator chooses the lane, model,
# and effort; this workflow only carries them out.
#
# Three lanes, two harnesses:
#   claude_subscription  Claude Code against the Claude subscription
#   openrouter           Claude Code against OpenRouter's Anthropic-compatible
#                        endpoint, for cheap backend overflow
#
# Codex is deliberately absent. Subscription-backed Codex Cloud is reached by
# mentioning @codex on a pull request, not by running an action, so it is
# delegated by the coordinator rather than dispatched here. See
# services/agentops/delegate.py.
#
# Dispatch inputs never reach a shell through ${{ }}. That substitution is
# textual, so a crafted branch name would inject a command; every run: block
# reads a job-level environment variable, and the inputs are validated first.

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Canonical task number from docs/06-tasks.md'
        required: true
        type: string
      lane:
        required: true
        type: choice
        options: [claude_subscription, openrouter]
      model:
        description: 'Harness model slug chosen by the coordinator'
        required: true
        type: string
      effort:
        required: true
        type: choice
        options: [low, medium, high, xhigh]
      branch:
        required: true
        type: string
      mode:
        description: 'implement a task, or repair the branch already open for it'
        required: false
        default: implement
        type: choice
        options: [implement, repair]
      repair_reason:
        description: 'what failed, when mode is repair'
        required: false
        default: ci
        type: choice
        options: [ci, review]

concurrency:
  # One writer per branch. This is the last line of defence behind the lease.
  #
  # Note this guards the branch, not ops/state. The steps in this workflow that
  # push the ledger take the shared agentops-state lock themselves, because the
  # coordinator and watchdog push the same files and an interleaved rebase
  # loses one side's write.
  group: agentops-worker-${{ inputs.branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-24.04
    # No checkout and no permissions: this job only reads a repository
    # variable, so the kill switch itself cannot be what leaks access.
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        env:
          AUTONOMY_ENABLED: ${{ vars.AUTONOMY_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${AUTONOMY_ENABLED:-false}" = 'true' ]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'AUTONOMY_ENABLED is not true; refusing to start work.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  work:
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      # Read by the finalize job, which writes the ledger from trusted
      # code. This job cannot do it itself: by the time these exist it has
      # checked out the task branch and let a model edit it, so running
      # services.agentops from here would hand a write token to unreviewed
      # code that could replace the structurally-restricted state push with
      # an arbitrary one.
      cost: ${{ steps.cost.outputs.cost }}
      pull_request: ${{ steps.pr.outputs.number }}
      harness_failed: ${{ steps.harness.outputs.failed }}
      gate: ${{ steps.gate.outcome }}
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # The guard reads this too, but its scope is that job only. Without it
      # here, verify-assignment loads the committed `enabled: false` and
      # refuses every worker.
      AUTONOMY_ENABLED: ${{ vars.AUTONOMY_ENABLED }}
      TASK_ID: ${{ inputs.task_id }}
      LANE: ${{ inputs.lane }}
      MODEL: ${{ inputs.model }}
      EFFORT: ${{ inputs.effort }}
      BRANCH: ${{ inputs.branch }}
      MODE: ${{ inputs.mode }}
      REPAIR_REASON: ${{ inputs.repair_reason }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate the dispatch inputs
        run: |
          set -euo pipefail
          case "$TASK_ID" in
            ''|*[!0-9]*) echo 'task_id must be a number' >&2; exit 1 ;;
          esac
          case "$BRANCH" in
            ''|-*|*[!A-Za-z0-9._/-]*)
              echo 'branch name contains something unsafe' >&2; exit 1 ;;
          esac
          # This job force-pushes the branch it is given. A reserved name would
          # mean writing straight to a protected branch instead of a task one.
          case "$BRANCH" in
            main|master|HEAD|refs/*|*/HEAD)
              echo "refusing to work on the reserved branch $BRANCH" >&2
              exit 1 ;;
          esac
          case "$BRANCH" in
            block-*|task-*) ;;
            *) echo "branch must be a task branch, got $BRANCH" >&2; exit 1 ;;
          esac
          case "$MODEL" in
            ''|-*|*[!A-Za-z0-9._/:-]*)
              echo 'model slug contains something unsafe' >&2; exit 1 ;;
          esac
          # Codex Cloud is delegated by mention, not dispatched as a worker.
          # Refuse rather than silently run the wrong harness for the lane.
          case "$LANE" in
            claude_subscription|openrouter) ;;
            *) echo "lane $LANE is not executable by this workflow" >&2; exit 1 ;;
          esac

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.11.16'

      - name: Read the runtime ledger
        # The lease this worker is about to check lives on the
        # agentops-state branch. The copy on the default branch is a seed.
        run: uv run --locked python -m services.agentops.cli state-pull

      - name: Re-check the assignment against policy
        # Dispatch inputs are caller-controlled. The worker re-derives the
        # policy decision itself rather than trusting what it was handed, so a
        # hand-dispatched run cannot pair frontend work with a lane forbidden
        # to write it, name an unqualified model, or reach past the gate.
        run: |
          set -euo pipefail
          uv run --locked python -m services.agentops.cli verify-assignment \
            --task "$TASK_ID" --lane "$LANE" --model "$MODEL" \
            --branch "$BRANCH" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Attach this run to the lease
        # The lease was taken by the coordinator, whose run is already over.
        # Recording this run is what lets the watchdog tell a live worker from
        # a dead one instead of abandoning a branch that is still in use.
        continue-on-error: true
        run: |
          set -euo pipefail
          # Re-runs the mutation against freshly pulled state on each
          # attempt rather than leaning on the push to merge for it. Safe to
          # repeat: attaching sets a field rather than accumulating one.
          for attempt in 1 2 3 4 5; do
            uv run --locked python -m services.agentops.cli state-pull
            uv run --locked python -m services.agentops.cli attach \
              --task "$TASK_ID" --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT"
            uv run --locked python -m services.agentops.cli validate || break
            if uv run --locked python -m services.agentops.cli state-push \
                 --message "Attach worker run ${GITHUB_RUN_ID} to task ${TASK_ID}"; then
              break
            fi
            sleep $((attempt * 5))
          done

      - name: Build the task brief
        # Deliberately before the task branch is checked out. This runs
        # orchestrator code with a repository token, and on a repair the branch
        # under repair is agent-written -- running it from that worktree would
        # let a branch edit services/agentops and execute it with the token
        # before anyone had reviewed the edit. Here the worktree is still the
        # default branch.
        #
        # brief.md is untracked, and `git checkout -B` keeps untracked files,
        # so it survives into the task branch where the harness reads it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${MODE:-implement}" = 'repair' ]; then
            # A repair brief names what failed instead of restating the task,
            # so the writer fixes the branch rather than reimplementing it.
            # Review findings come from the same deterministic verdict the
            # merge gate uses, not from a model re-reading the thread.
            findings=()
            if [ "${REPAIR_REASON:-ci}" = 'review' ]; then
              pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --base main                 --state open --json number --jq '.[0].number // empty' || true)"
              if [ -n "$pr" ]; then
                uv run --locked python -m services.agentops.cli review-verdict                   --repo "$REPO" --pull-request "$pr" > findings.json || true
                findings=(--findings findings.json)
              fi
            fi
            uv run --locked python -m services.agentops.brief               --task "$TASK_ID" --repair "${REPAIR_REASON:-ci}"               "${findings[@]}" --out brief.md
          else
            uv run --locked python -m services.agentops.brief               --task "$TASK_ID" --out brief.md
          fi

      - name: Check out the task branch
        run: |
          set -euo pipefail
          git config user.name 'shoulder-agentops[bot]'
          git config user.email 'shoulder-agentops@users.noreply.github.com'
          # Resume an existing branch rather than resetting it. `-B` with no
          # start point resets to the current HEAD, so on a recovery attempt
          # this would throw away the previous worker's pushed commits and the
          # later force-push would make that permanent.
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "resumed the existing branch $BRANCH"
          else
            git checkout -B "$BRANCH"
            echo "started a new branch $BRANCH"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          uv sync --locked

      # --- Claude lane: the Claude subscription pays for this one -----------
      - name: Implement with Claude
        id: claude
        if: inputs.lane == 'claude_subscription'
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This workflow is dispatched by the coordinator through the Actions
          # API, so GITHUB_ACTOR is `github-actions`, and the action refuses a
          # non-human actor unless it is named here. Named exactly, never '*':
          # a wildcard would let any App that can dispatch this workflow run a
          # prompt through our subscription.
          allowed_bots: github-actions
          prompt: 'Read brief.md in the repository root and carry out exactly what it specifies. Do not exceed its stated scope.'
          claude_args: --model ${{ inputs.model }} --max-turns 120

      # --- OpenRouter lane: same harness, Anthropic-compatible endpoint -----
      - name: Implement with an OpenRouter model
        id: openrouter
        if: inputs.lane == 'openrouter'
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520 # v1
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ''
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Same dispatching actor as the Claude lane above, same narrow entry.
          allowed_bots: github-actions
          prompt: 'Read brief.md in the repository root and carry out exactly what it specifies. Do not exceed its stated scope.'
          claude_args: --model ${{ inputs.model }} --max-turns 120

      - name: Record what the run cost
        # Both lanes bill differently -- the Claude lane against a
        # subscription, OpenRouter against credits -- but both run the
        # Claude Code harness, which reports usage in its execution file.
        # Recording it is what makes the OpenRouter ceilings real.
        id: cost
        if: always()
        continue-on-error: true
        env:
          EXECUTION_FILE: >-
            ${{ steps.claude.outputs.execution_file
            || steps.openrouter.outputs.execution_file }}
        run: |
          set -uo pipefail
          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -s "$EXECUTION_FILE" ]; then
            echo 'no execution file; nothing to record'
            exit 0
          fi
          cost="$(jq -r '[.. | objects | .total_cost_usd? // empty] | first // 0' \
            "$EXECUTION_FILE")"
          if [ "$cost" = '0' ] || [ "$cost" = 'null' ]; then
            echo 'the harness reported no cost'
            exit 0
          fi
          echo "cost=$cost" >> "$GITHUB_OUTPUT"

      - name: Flag a provider failure
        # Only when the provider's own harness failed. `failure()` alone
        # fires after any earlier step too, so a registry outage during
        # dependency install or a bad brief would blame the provider and
        # take a healthy lane out of the pool.
        #
        # This only records the fact as an output. The ledger write happens
        # in the finalize job, from the default branch, because this
        # worktree is the task branch a model has just been editing.
        id: harness
        if: failure() && (steps.claude.outcome == 'failure' || steps.openrouter.outcome == 'failure')
        run: echo 'failed=true' >> "$GITHUB_OUTPUT"

      - name: Run the repository quality gate
        id: gate
        continue-on-error: true
        shell: pwsh
        run: ./scripts/check.ps1

      - name: Push the branch and open a pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          rm -f brief.md findings.json
          # A harness may commit its own work, so an uncommitted-changes check
          # alone would report "no change" for a run that did plenty. Look at
          # both the working tree and what the branch has gained over main.
          uncommitted=1
          git diff --quiet HEAD -- . ':!ops/state' && uncommitted=0
          committed=1
          git diff --quiet "origin/main...HEAD" -- . ':!ops/state' && committed=0
          if [ "$uncommitted" = '0' ] && [ "$committed" = '0' ]; then
            echo 'The worker produced no change.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Put the runtime ledger back to whatever this branch carries before
          # staging anything. `state-pull` writes the live ledger into
          # ops/state, and starting a NEW branch keeps the worktree as it is,
          # so `git add -A` would otherwise commit leases, spend and provider
          # health into a product pull request -- where a reviewer would be
          # asked to approve them and a merge would copy them onto main.
          git checkout HEAD -- ops/state 2>/dev/null || true
          git add -A
          # Belt and braces: the ledger is never this branch's business.
          git reset -q -- ops/state 2>/dev/null || true
          git commit -m "Task $TASK_ID: autonomous implementation" || true
          git push --force-with-lease origin "$BRANCH"
          body="$(printf '%s\n' \
            "Autonomous implementation of canonical Task $TASK_ID." \
            '' \
            "- lane: $LANE" \
            "- model: $MODEL" \
            "- effort: $EFFORT" \
            "- quality gate: $GATE" \
            '' \
            'Independent review and green CI are required before merge.')"
          gh pr create --base main --head "$BRANCH" \
            --title "Task $TASK_ID: autonomous implementation" \
            --body "$body" \
            || echo 'a pull request already exists for this branch'

          # Hand merging to GitHub rather than polling for green. Auto-merge
          # fires only once every required branch-protection context passes --
          # Quality and the independent review verdict -- so this cannot merge
          # failing or unreviewed work, and no runner has to stay alive waiting
          # for checks that take longer than this job does.
          #
          # rm -f brief.md above keeps the brief out of the branch; findings.json
          # is a repair artefact and must not land either.
          gh pr merge "$BRANCH" --auto --squash --delete-branch \
            || echo 'auto-merge could not be enabled; the pull request waits for review'

          number="$(gh pr list --repo "$REPO" --head "$BRANCH" --base main \
            --state open --json number --jq '.[0].number // empty' || true)"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

  finalize:
    # Everything that has to happen after the harness, run from trusted code.
    #
    # These writes used to live in the work job. By then that worktree is the
    # task branch a model has been editing, and the job holds `contents: write`
    # plus a token: a change to `cli.py` or `statebranch.py` on that branch
    # would execute here, with the credential, before anyone reviewed it -- and
    # could replace the structurally-restricted state push with an arbitrary
    # one. A separate job gets a clean runner and the default branch.
    needs: work
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the agentops-state branch only
      issues: write # activity feed and Control Center
    outputs:
      # Read by the relaunch job below, which holds the dispatch scope this one
      # deliberately does not.
      recovered: ${{ steps.record.outputs.recovered }}
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      # The Control Center reports the kill switch, and `load_policy` reads it
      # from the environment. Without it here the committed `enabled: false`
      # seed is what gets rendered, so a live autonomous run published
      # "AUTONOMY STATUS: PAUSED" while it was running. Absent or empty still
      # means off, so the default-off behaviour is unchanged.
      AUTONOMY_ENABLED: ${{ vars.AUTONOMY_ENABLED }}
      TASK_ID: ${{ inputs.task_id }}
      LANE: ${{ inputs.lane }}
      COST: ${{ needs.work.outputs.cost }}
      PR_NUMBER: ${{ needs.work.outputs.pull_request }}
      HARNESS_FAILED: ${{ needs.work.outputs.harness_failed }}
      WORK_RESULT: ${{ needs.work.result }}
      GATE: ${{ needs.work.outputs.gate }}
      MODEL: ${{ inputs.model }}
      EFFORT: ${{ inputs.effort }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The default branch. Never the task branch, which is the point.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.11.16'

      - name: Record spend, the pull request, and any provider failure
        id: record
        continue-on-error: true
        run: |
          set -uo pipefail
          # Re-runs its mutations against freshly pulled state on each attempt.
          # `state-push` reports a lost race rather than resolving it, because
          # another writer may have changed the same file and re-applying this
          # run's bytes would overwrite them.
          #
          # Every mutation here is safe to repeat: attaching sets a field,
          # marking health sets a value, spend carries a once-key so a retry
          # cannot double-count against the per-task ceiling, and freeing the
          # lease refuses once it is no longer active.
          pushed=0
          for attempt in 1 2 3 4 5; do
            uv run --locked python -m services.agentops.cli state-pull

            if [ -n "${PR_NUMBER:-}" ]; then
              uv run --locked python -m services.agentops.cli attach \
                --task "$TASK_ID" --pull-request "$PR_NUMBER" || true
            fi
            if [ -n "${COST:-}" ] && [ "$COST" != '0' ] && [ "$COST" != 'null' ]; then
              uv run --locked python -m services.agentops.cli spend \
                --lane "$LANE" --usd "$COST" --task "$TASK_ID" \
                --once-key "run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" || true
            fi
            if [ "${HARNESS_FAILED:-}" = 'true' ]; then
              # DEGRADED keeps the lane out of the pool until something proves
              # it works again, so the next coordinator run takes the fallback
              # chain instead of choosing the lane that just failed.
              uv run --locked python -m services.agentops.cli health \
                --lane "$LANE" --status DEGRADED \
                --reason "worker run ${GITHUB_RUN_ID} failed" || true
            fi

            # A worker that ended without a pull request leaves nothing for the
            # repair path to work on, and its lease would otherwise sit
            # `assigned` until `expires_at` -- the full 90-minute job timeout --
            # before the watchdog could touch it. This job only runs once `work`
            # has concluded, which is the proof that the writer has stopped;
            # every other condition is checked by the command, which refuses
            # rather than guesses. It does not fake completion: the lease is
            # abandoned, keeping its attempts and checkpoint, so the coordinator
            # picks the task up again on the normal fallback chain.
            if [ "${WORK_RESULT:-}" != 'success' ] && [ -z "${PR_NUMBER:-}" ]; then
              class=worker
              if [ "${HARNESS_FAILED:-}" = 'true' ]; then
                class=provider
              fi
              uv run --locked python -m services.agentops.cli worker-finished \
                --task "$TASK_ID" --branch "$BRANCH" --run-id "$GITHUB_RUN_ID" \
                --failure-class "$class" --repo "$REPO" \
                > worker-finished.json || true
            fi

            uv run --locked python -m services.agentops.cli validate || break
            if uv run --locked python -m services.agentops.cli state-push \
                 --message "Record worker run ${GITHUB_RUN_ID} for task ${TASK_ID}"; then
              pushed=1
              break
            fi
            sleep $((attempt * 5))
          done

          # Only a recovery that actually reached the ledger may restart the
          # loop. Claiming one that was never pushed would dispatch a
          # coordinator that still sees the lease held, which does nothing.
          if [ "$pushed" = '1' ] && [ -s worker-finished.json ] && \
             [ "$(jq -r '.recovered // false' worker-finished.json)" = 'true' ]; then
            echo 'recovered=true' >> "$GITHUB_OUTPUT"
          fi
          rm -f worker-finished.json

      - name: Report to the activity feed
        # Also moved off the task branch. `cli notify` is orchestrator code and
        # this step carries a token, so running it from a worktree a model has
        # been editing is the same hazard as the ledger write above.
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          details="$(jq -nc \
            --arg lane "$LANE" --arg model "$MODEL" --arg effort "$EFFORT" \
            --arg branch "$BRANCH" --arg gate "$GATE" --arg result "$WORK_RESULT" \
            '{lane: $lane, model: $model, effort: $effort, branch: $branch,
              gate: $gate, result: $result}')"
          uv run --locked python -m services.agentops.cli notify verify \
            "Task $TASK_ID worker finished" \
            --details "$details" \
            --repo "$REPO" || echo 'activity feed unavailable'

      - name: Refresh the Control Center
        # After the ledger write above, so the page shows what just happened
        # rather than the state this task started from.
        continue-on-error: true
        run: |
          set -uo pipefail
          uv run --locked python -m services.agentops.cli state-pull || true
          uv run --locked python -m services.agentops.cli control-center \
            --repo "$REPO" || echo 'control center unavailable'

  relaunch:
    # Continuation after a recovered lease. Freeing it is only half the job:
    # the task produced no pull request, so no merge and no failing check will
    # ever fire, and nothing else would notice until the hourly watchdog saw
    # the system idle.
    #
    # Its own job for the same reason the watchdog splits `rearm` out of
    # `sweep`. Dispatching a workflow needs `actions: write`, and finalize must
    # not hold it: that job pushes the state branch, so the scopes are kept on
    # separate runners rather than pooled on one. This job checks nothing out
    # and can only start the coordinator, which then re-derives every decision
    # itself.
    #
    # Attempts stay bounded by max_implementation_attempts, so a task that
    # keeps dying this way is blocked rather than dispatched forever.
    needs: finalize
    # Gated on the repository variable, not on a value carried through the run:
    # this starts new work, so the kill switch has to be able to stop it.
    if: needs.finalize.outputs.recovered == 'true' && vars.AUTONOMY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write # dispatch the coordinator, and nothing else
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run agentops-coordinator.yml --repo "$REPO"
