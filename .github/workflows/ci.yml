name: Quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.11.16'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Formatting, lint, types, tests, contracts, build, browser smoke
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Database migrations, RLS, and runtime-role isolation
        env:
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
          REQUIRE_DATABASE_TESTS: '1'
          ALLOW_POLICY_MUTATION: '1'
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${{ github.run_id }}-${{ github.run_attempt }}-ci-only@127.0.0.1:5432/postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/fixtures/ci-auth-schema.sql
          uv run --locked alembic upgrade head
          runtime_password="$(openssl rand -hex 24)"
          for role in shoulder_api shoulder_operator shoulder_worker; do
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE $role PASSWORD '$runtime_password'"
          done
          export OPERATOR_DATABASE_URL="postgresql+psycopg://shoulder_operator:$runtime_password@127.0.0.1:5432/postgres"
          export DATABASE_URL="postgresql+psycopg://shoulder_api:$runtime_password@127.0.0.1:5432/postgres"
          export WORKER_DATABASE_URL="postgresql+psycopg://shoulder_worker:$runtime_password@127.0.0.1:5432/postgres"
          uv run --locked python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Start pinned object storage
        # The same digest-pinned images infra/compose.yaml runs locally. MinIO
        # is a step rather than a service container because a service cannot
        # supply the `server /data` command the image needs. In September 2026
        # MinIO put both quay.io and Docker Hub behind a login, so CI pulls
        # private mirrors built FROM the previously pinned digests (same
        # release, same layers, amd64 only) from this owner's GHCR.
        env:
          MINIO_ROOT_USER: shoulder-ci
          MINIO_ROOT_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
          MINIO_IMAGE: ghcr.io/kush-nagar/shoulder-minio:RELEASE.2025-09-07T16-13-09Z@sha256:b1ebc9cbc53676d27c95b81908351035d4f512776c175eef3ee60ad172e05ccc
          MC_IMAGE: ghcr.io/kush-nagar/shoulder-mc:RELEASE.2025-08-13T08-35-41Z@sha256:56f33d7e7f19f35fa014f9039c90f73bcb552c7dbd0f7e590a81638ebd361108
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name shoulder-minio --network host -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD -e MINIO_API_CORS_ALLOW_ORIGIN=http://127.0.0.1:3000 "$MINIO_IMAGE" server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/ready
          docker run --rm --network host -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD --entrypoint /bin/sh "$MC_IMAGE" -ec 'mc alias set ci http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null; mc mb --ignore-existing ci/shoulder-ci >/dev/null; mc anonymous set none ci/shoulder-ci >/dev/null'
      - name: Storage integration and the upload API
        # The 2 GB proof stays out of pull-request CI by design
        # (`docs/11-testing-quality.md`); scripts/check-storage.ps1 runs it.
        env:
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${{ github.run_id }}-${{ github.run_attempt }}-ci-only@127.0.0.1:5432/postgres
          REQUIRE_DATABASE_TESTS: '1'
          REQUIRE_STORAGE_TESTS: '1'
          R2_ENDPOINT_URL: http://127.0.0.1:9000
          R2_BUCKET: shoulder-ci
          R2_REGION: auto
          R2_ACCESS_KEY_ID: shoulder-ci
          R2_SECRET_ACCESS_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
        run: |
          runtime_password="$(openssl rand -hex 24)"
          for role in shoulder_api shoulder_operator shoulder_worker; do
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE $role PASSWORD '$runtime_password'"
          done
          export OPERATOR_DATABASE_URL="postgresql+psycopg://shoulder_operator:$runtime_password@127.0.0.1:5432/postgres"
          export DATABASE_URL="postgresql+psycopg://shoulder_api:$runtime_password@127.0.0.1:5432/postgres"
          export WORKER_DATABASE_URL="postgresql+psycopg://shoulder_worker:$runtime_password@127.0.0.1:5432/postgres"
          uv run --locked python -m unittest tests.test_storage tests.test_api_upload -v
      - name: Dependency vulnerabilities
        run: |
          pnpm audit --audit-level=low
          uv run --locked pip-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
