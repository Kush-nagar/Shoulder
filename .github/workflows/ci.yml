name: Task 1 quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.11.16'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Formatting, lint, types, tests, contracts, build, browser smoke
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Database migrations, RLS, and runtime-role isolation
        env:
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
          REQUIRE_DATABASE_TESTS: '1'
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${{ github.run_id }}-${{ github.run_attempt }}-ci-only@127.0.0.1:5432/postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/fixtures/ci-auth-schema.sql
          uv run --locked alembic upgrade head
          runtime_password="$(openssl rand -hex 24)"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE shoulder_api PASSWORD '$runtime_password'"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE shoulder_operator PASSWORD '$runtime_password'"
          export OPERATOR_DATABASE_URL="postgresql+psycopg://shoulder_operator:$runtime_password@127.0.0.1:5432/postgres"
          export DATABASE_URL="postgresql+psycopg://shoulder_api:$runtime_password@127.0.0.1:5432/postgres"
          uv run --locked python -m unittest discover -s tests -p test_database.py -v
      - name: Dependency vulnerabilities
        run: |
          pnpm audit --audit-level=low
          uv run --locked pip-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
