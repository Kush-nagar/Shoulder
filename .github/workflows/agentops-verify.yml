name: AgentOps Verify

# Bootstrap verification, run in the cloud because that is the only place the
# provider credentials exist. A local run cannot prove any of this: the secrets
# are write-only to everything outside Actions.
#
# It proves lanes work rather than asserting they do:
#   * the live model catalogue is reachable and parses
#   * OpenRouter answers real requests under the privacy contract, and the
#     qualification suite produces verdicts
#   * the Claude subscription token actually authenticates a cloud run
#   * the coordinator reaches a decision with real state
#
# It never implements product work and never enables autonomy.
#
# It runs only from the default branch, by explicit dispatch. It holds the
# provider secrets, so it must never execute code from an unmerged branch.

on:
  workflow_dispatch:
    inputs:
      qualify_limit:
        description: 'How many candidate models to qualify (costs a few cents)'
        type: string
        default: '4'
      qualify_models:
        description: 'Space-separated model ids to qualify instead of a sweep'
        type: string
        default: ''
  # Also on a merge that changes the control plane, which needs no ref choice
  # at all and is the safer of the two paths.
  push:
    branches: [main]
    paths:
      - 'ops/policy.json'
      - 'services/agentops/**'
      - '.github/workflows/agentops-*.yml'
concurrency:
  # Shared with the coordinator and the watchdog: all three commit ops/state to
  # the default branch, and a merge fires this workflow and the coordinator at
  # the same moment. Running them together is what left this workflow stuck in
  # a rebase conflict on 2026-09-13, losing the verdicts it had just paid for.
  # cancel-in-progress must stay false here, or joining the group would cancel
  # a coordinator run mid-push.
  group: agentops-state
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    # `gh workflow run --ref` chooses which branch's *workflow file* runs, so
    # pinning the checkout is not enough on its own: a branch could rewrite
    # these steps. This refuses a dispatch from anywhere but the default
    # branch, which stops the accidental case outright.
    #
    # It does not stop a determined one: replacing this file requires push
    # access, and anyone with that could change the default branch anyway. The
    # containment that matters is elsewhere -- an autonomous worker's token
    # has no `actions: write`, so a compromised worker cannot dispatch this
    # workflow at all.
    runs-on: ubuntu-24.04
    steps:
      - env:
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$REF" != "$DEFAULT_BRANCH" ]; then
            echo "refusing a verification dispatch from $REF;"               "this workflow holds every provider credential and runs only"               "from $DEFAULT_BRANCH" >&2
            exit 1
          fi

  verify:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # commit qualification verdicts back to the branch
      issues: write # post the result to the activity feed
      id-token: write # the Claude action's default app authentication
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      QUALIFY_LIMIT: ${{ inputs.qualify_limit || '4' }}
      QUALIFY_MODELS: ${{ inputs.qualify_models }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Pinned to the default branch, not the dispatched ref. `gh workflow run
      # --ref` selects which branch's workflow file runs, so an unqualified
      # checkout follows that branch and would hand the provider credentials
      # to code that has not been reviewed or merged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.11.16'

      - name: Discover the live model catalogue
        id: discover
        run: |
          set -euo pipefail
          uv run --locked python -m services.agentops.cli discover > discover.json
          cat discover.json >> "$GITHUB_STEP_SUMMARY"
          test "$(jq -r '.ok' discover.json)" = 'true'

      - name: Probe provider health
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          uv run --locked python -m services.agentops.cli health --probe \
            > health.json
          cat health.json >> "$GITHUB_STEP_SUMMARY"

      - name: Read OpenRouter's own usage numbers
        # The local ledger only knows what this system recorded. This is the
        # provider's own figure, so a ceiling can be checked against reality
        # rather than an estimate.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          uv run --locked python -m services.agentops.cli usage > usage.json
          cat usage.json >> "$GITHUB_STEP_SUMMARY"

      - name: Qualify models against the synthetic suite
        # Costs real money, and on push the verdicts are never committed.
        if: github.event_name == 'workflow_dispatch'
        id: qualify
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          # Both model-selecting lanes need qualified models, or routing has
          # nothing to choose and blocks. The probes go through OpenRouter
          # because that one interface reaches every family for a few cents;
          # where a model was tested does not change which lane executes it.
          # The Codex lane is absent on purpose: it cannot be told which model
          # to use, so it is gated on lane_qualified instead.
          if [ -n "${QUALIFY_MODELS:-}" ]; then
            # Named models, for testing a specific new release rather than
            # sweeping. The suite and the verdicts are the same: a model named
            # here is not promoted, it is tested, and it stays CANDIDATE unless
            # it passes.
            args=''
            for m in $QUALIFY_MODELS; do
              args="$args --model $m"
            done
            # shellcheck disable=SC2086
            uv run --locked python -m services.agentops.cli qualify $args \
              > qualify.json
            cat qualify.json >> "$GITHUB_STEP_SUMMARY"
          else
            for lane in claude_subscription openrouter; do
              uv run --locked python -m services.agentops.cli qualify \
                --lane "$lane" --limit "$QUALIFY_LIMIT" > "qualify-$lane.json"
              cat "qualify-$lane.json" >> "$GITHUB_STEP_SUMMARY"
            done
            jq -s '{results: (map(.results) | add)}' \
              qualify-claude_subscription.json qualify-openrouter.json > qualify.json
          fi
          cost="$(jq -r '[.results[].cost_usd] | add // 0' qualify.json)"
          echo "cost=$cost" >> "$GITHUB_OUTPUT"
          # Record what the qualification run itself spent, so the ceilings
          # account for it rather than treating it as free.
          if [ "$cost" != '0' ] && [ "$cost" != 'null' ]; then
            uv run --locked python -m services.agentops.cli spend \
              --lane openrouter --usd "$cost"
          fi

      # The Claude lane is proven by a real cloud run with the subscription
      # token. A read-only prompt: this must not touch the repository.
      - name: Smoke test the Claude subscription lane
        id: claude
        # The action does not support the push event: on a merge it fails with
        # "Unsupported event type: push", which was then recorded as a failure
        # of a lane that is in fact healthy.
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            Read ops/policy.json and reply with exactly one line naming the
            lanes it defines. Do not modify any file and do not run any command
            other than reading that one file.
          claude_args: --max-turns 4

      - name: Record the Claude lane result
        if: github.event_name == 'workflow_dispatch'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          if [ "$CLAUDE_OUTCOME" = 'success' ]; then
            uv run --locked python -m services.agentops.cli health \
              --lane claude_subscription --status AVAILABLE \
              --reason 'cloud smoke test passed'
          else
            uv run --locked python -m services.agentops.cli health \
              --lane claude_subscription --status AUTH_FAILED \
              --reason 'cloud smoke test failed; check CLAUDE_CODE_OAUTH_TOKEN'
          fi

      - name: Run the coordinator dry run
        id: plan
        run: |
          set -euo pipefail
          uv run --locked python -m services.agentops.cli plan > plan.json
          cat plan.json >> "$GITHUB_STEP_SUMMARY"
          uv run --locked python -m services.agentops.cli status \
            >> "$GITHUB_STEP_SUMMARY"
          # Autonomy must still be off after every one of these steps.
          test "$(jq -r '.autonomy_enabled' plan.json)" = 'false'

      - name: Commit the qualification verdicts
        # A push-triggered run proves the control plane still loads and plans.
        # It records nothing, so it cannot race the coordinator's own commit.
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name 'shoulder-agentops[bot]'
          git config user.email 'shoulder-agentops@users.noreply.github.com'

          # Keep this run's verdicts somewhere the branch switch cannot touch.
          cp ops/state/models.json "$RUNNER_TEMP/verdicts.json"

          # Authenticate this step's own remote work with the job token rather
          # than relying on whatever credential the checkout left behind: a
          # later action in this job can replace it, and a run that had already
          # paid for its verdicts then failed on the first fetch with
          # "Password authentication is not supported". The header is passed per
          # command, so the token is never written into the remote URL or the
          # repository config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # The runner masks the token itself, but not this encoding of it, so
          # say so explicitly before it can reach a log line.
          echo "::add-mask::$auth"
          git_auth() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"
          }

          # Read-modify-write, not rebase. This run refreshed the whole
          # catalogue before qualifying anything, so its models.json differs
          # from the branch's in every last_seen timestamp; rebasing that
          # against another writer's commit conflicts on a generated file, and
          # that is how two runs lost verdicts they had already paid for.
          for attempt in 1 2 3 4 5; do
            git_auth fetch origin "$DEFAULT_BRANCH"
            git checkout -B agentops-verdicts "origin/$DEFAULT_BRANCH"
            git checkout "origin/$DEFAULT_BRANCH" -- ops/state
            # Belt and braces: never push from anywhere but the branch just made.
            if [ "$(git rev-parse --abbrev-ref HEAD)" != 'agentops-verdicts' ]; then
              echo 'not on the expected state branch; refusing to push' >&2
              exit 1
            fi

            # What main is carrying, before this run builds on it. If another
            # writer ever lands a corrupt ledger, stop rather than extend it.
            uv run --locked python -m services.agentops.cli validate

            uv run --locked python -m services.agentops.cli merge-verdicts \
              --from "$RUNNER_TEMP/verdicts.json"
            # A conflict marker in a generated file nobody reads by hand would
            # be committed silently. Never commit one.
            uv run --locked python -m services.agentops.cli validate
            git add ops/state
            if git diff --cached --quiet; then
              echo 'verdicts already recorded'
              exit 0
            fi
            git commit -m 'Record provider qualification from a cloud verify run'
            if git_auth push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            echo "another writer landed first; re-reading and re-applying (attempt $attempt)" >&2
          done
          echo 'could not record the qualification verdicts' >&2
          exit 1

      - name: Report to the activity feed
        if: always()
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          QUALIFY_COST: ${{ steps.qualify.outputs.cost }}
        run: |
          set -uo pipefail
          qualified="$(jq -c '[.results[]? | select(.verdict=="QUALIFIED") | .model]' \
            qualify.json 2>/dev/null || echo '[]')"
          details="$(jq -nc \
            --arg claude "$CLAUDE_OUTCOME" \
            --arg cost "$QUALIFY_COST" \
            --argjson qualified "$qualified" \
            '{claude_lane: $claude, qualification_cost_usd: $cost, qualified: $qualified}')"
          uv run --locked python -m services.agentops.cli notify verify \
            'Bootstrap verification run finished' \
            --details "$details" --repo "$REPO" \
            || echo 'activity feed unavailable'
